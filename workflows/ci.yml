name: CI — Test & Deploy to Hugging Face

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-omit="tests/*,*/__init__.py" --ignore=tests/test_app.py
        env:
          GOOGLE_API_KEY: ""
          FACT_CHECK_API_KEY: ""

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  deploy:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@buddhiman-bharat.ai"
          git config --global user.name "Buddhiman Bharat CI"
          git remote add hf https://HF_USERNAME:${HF_TOKEN}@huggingface.co/spaces/HF_USERNAME/buddhiman-bharat || true
          git push hf main --force
